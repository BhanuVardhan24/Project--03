name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run tests
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          if suite.countTestCases() == 0:
              sys.exit("ERROR: No tests discovered")

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

      - name: Build container image
        run: docker build -t project03-api:${{ github.sha }} .

      - name: Start container
        run: |
          docker run -d \
            --name api-ci \
            -p 127.0.0.1:8080:8000 \
            -e APP_VERSION=ci \
            -e GIT_SHA="${{ github.sha }}" \
            project03-api:${{ github.sha }}

      - name: Check container health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/health \
              | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "healthy"'; then
              echo "Container health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "Container failed to become healthy"
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs api-ci 2>/dev/null || true

      - name: Remove test container
        if: always()
        run: docker rm -f api-ci 2>/dev/null || true