name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Download source code and Git history
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Check committed code for secrets
      - name: Scan Git history for secrets
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo \
            --redact \
            --verbose \
            --log-opts="--all"

      # 3. Prepare Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # 4. Run application tests; fail if none are discovered
      - name: Run tests
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          if suite.countTestCases() == 0:
              sys.exit("ERROR: No tests discovered")

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

      # 5. Build the image once
      - name: Build container image
        run: docker build --pull -t project03-api:${{ github.sha }} .

      # 6. Check that image for vulnerabilities
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: project03-api:${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      # 7. Start the same image
      - name: Start container
        run: |
          docker run -d \
            --name api-ci \
            -p 127.0.0.1:8080:8000 \
            -e APP_VERSION=ci \
            -e GIT_SHA="${{ github.sha }}" \
            project03-api:${{ github.sha }}

      # 8. Verify the running container responds correctly
      - name: Check container health
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/health \
              | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "healthy"'; then
              echo "Container health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "Container failed to become healthy"
          exit 1

      # 9. Obtain temporary AWS credentials — main pushes only
      - name: Authenticate to AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "036706657723"

      # 10. Authenticate Docker to ECR — main pushes only
      - name: Log in to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

      # 11. Publish the tested image — no rebuild
      - name: Push tested image and record digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          docker tag \
            "project03-api:${GITHUB_SHA}" \
            "${IMAGE_URI}:${IMAGE_TAG}"

          docker push "${IMAGE_URI}:${IMAGE_TAG}"

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          [[ "$DIGEST" == sha256:* ]] || {
            echo "Could not retrieve the image digest"
            exit 1
          }

          {
            echo "### Published image"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Tag: ${IMAGE_TAG}"
            echo "- Deployment reference: ${IMAGE_URI}@${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 12. Collect logs even if an earlier step failed
      - name: Show container logs
        if: always()
        run: docker logs api-ci 2>/dev/null || true

      # 13. Clean up even if an earlier step failed
      - name: Remove test container
        if: always()
        run: docker rm -f api-ci 2>/dev/null || true